name: handelha
description: "هندلها - خطوة هادئة لتنظيم يومك ومشاريعك"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^2.0.0
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7

  # Navigation
  go_router: ^18.0.2

  # UI & Fonts
  google_fonts: ^9.0.0

  # Serialization
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # Localization
  intl: ^0.20.3

  # Local Database (lightweight, no native issues)
  shared_preferences: ^2.3.3

  # Local device notifications for scheduled task reminders
  flutter_local_notifications: ^19.4.0
  timezone: ^0.10.1
  # Google Play subscriptions through RevenueCat
  purchases_flutter: ^9.9.0

  # Secure Storage
  flutter_secure_storage: ^9.2.2

  # UUID
  uuid: ^4.5.1

  # Equatable
  equatable: ^2.0.7
  crypto: ^3.0.7

  # Internal Project-Owned AI Assistant module
  ai_assistant:
    path: packages/ai_assistant
  sqflite: ^2.4.6
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  freezed: ^4.0.2
  json_serializable: ^6.14.1
  riverpod_generator: ^4.0.9
  sqflite_common_ffi: ^2.4.7

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/
  fonts:
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Light.ttf
          weight: 300
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
